name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app
        run: xcodebuild -project RAMN.xcodeproj -scheme RAMN -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RAMN.app Payload/RAMN.app
          /usr/bin/zip -r RAMN-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAMN-unsigned-IPA
          path: RAMN-unsigned.ipa
          if-no-files-found: error
